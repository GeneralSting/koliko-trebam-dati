<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#D63A50"/>
      <stop offset="0.5" stop-color="#9E1830"/>
      <stop offset="1" stop-color="#520E1F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE6A8"/>
      <stop offset="0.5" stop-color="#E7B85A"/>
      <stop offset="1" stop-color="#B8893A"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <radialGradient id="vig" cx="0.5" cy="0.38" r="0.85"><stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.24"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.75">
    <circle cx="200" cy="205" r="125" fill="#E7B85A" opacity="0.55"/>
    <circle cx="320" cy="120" r="100" fill="#D43A52"/>
  </g>

  <!-- two rings -->
  <g fill="none">
    <circle cx="170" cy="205" r="46" stroke="url(#gold)" stroke-width="13"/>
    <circle cx="170" cy="205" r="40" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M138 188 a46 46 0 0 1 22 -24" stroke="#FFF4D6" stroke-width="4" stroke-linecap="round" opacity="0.65"/>

    <circle cx="232" cy="218" r="46" stroke="url(#gold)" stroke-width="13"/>
    <circle cx="232" cy="218" r="40" stroke="#000000" stroke-opacity="0.18" stroke-width="2"/>
    <path d="M200 201 a46 46 0 0 1 22 -24" stroke="#FFF4D6" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- sparkles -->
  <g fill="#FFF1CB">
    <path d="M118 120 c1 5 3 7 8 8 -5 1 -7 3 -8 8 -1 -5 -3 -7 -8 -8 5 -1 7 -3 8 -8 z"/>
    <path d="M292 280 c0.8 4 2.4 5.6 6.4 6.4 -4 0.8 -5.6 2.4 -6.4 6.4 -0.8 -4 -2.4 -5.6 -6.4 -6.4 4 -0.8 5.6 -2.4 6.4 -6.4 z"/>
    <path d="M300 168 c0.6 3 1.8 4.2 4.8 4.8 -3 0.6 -4.2 1.8 -4.8 4.8 -0.6 -3 -1.8 -4.2 -4.8 -4.8 3 -0.6 4.2 -1.8 4.8 -4.8 z" opacity="0.85"/>
    <circle cx="110" cy="270" r="2.6" opacity="0.8"/>
    <circle cx="250" cy="120" r="2.2" opacity="0.7"/>
  </g>

  <rect width="400" height="500" fill="url(#vig)"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
