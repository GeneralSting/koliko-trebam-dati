<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#57BBA2"/>
      <stop offset="0.5" stop-color="#2E8C7A"/>
      <stop offset="1" stop-color="#154A42"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <radialGradient id="vig" cx="0.5" cy="0.36" r="0.85"><stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.2"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.7">
    <circle cx="320" cy="115" r="120" fill="#AEE8CF"/>
    <circle cx="70" cy="290" r="130" fill="#226E60"/>
  </g>

  <!-- streamers -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 100 C 120 150 80 230 175 255" stroke="#FFD79E" stroke-width="9" opacity="0.85"/>
    <path d="M360 120 C 285 175 330 250 240 300" stroke="#FFFFFF" stroke-width="8" opacity="0.7"/>
    <path d="M70 360 C 130 300 210 320 250 250" stroke="#F2A0B8" stroke-width="8" opacity="0.7"/>
  </g>

  <!-- confetti -->
  <g>
    <rect x="120" y="120" width="9" height="9" rx="1.6" fill="#FFD79E" transform="rotate(20 124 124)"/>
    <rect x="250" y="150" width="8" height="8" rx="1.4" fill="#FFFFFF" opacity="0.85" transform="rotate(-22 254 154)"/>
    <rect x="300" y="240" width="9" height="9" rx="1.6" fill="#F2A0B8" transform="rotate(15 304 244)"/>
    <rect x="95" y="220" width="8" height="8" rx="1.4" fill="#FFFFFF" opacity="0.7" transform="rotate(35 99 224)"/>
    <rect x="190" y="300" width="9" height="9" rx="1.6" fill="#FFD79E" opacity="0.9" transform="rotate(-12 194 304)"/>
    <circle cx="160" cy="185" r="4" fill="#FFFFFF" opacity="0.85"/>
    <circle cx="285" cy="195" r="3.6" fill="#FFD79E"/>
    <circle cx="135" cy="290" r="3.4" fill="#F2A0B8"/>
    <circle cx="225" cy="120" r="3.2" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="320" cy="300" r="3.2" fill="#FFD79E" opacity="0.85"/>
    <path d="M210 200 l6 0 l-3 6 z" fill="#FFFFFF" opacity="0.8"/>
    <path d="M105 160 l6 0 l-3 6 z" fill="#FFD79E" opacity="0.85"/>
  </g>

  <rect width="400" height="500" fill="url(#vig)"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
