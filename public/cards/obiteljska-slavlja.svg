<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#F4B47C"/>
      <stop offset="0.5" stop-color="#D6697A"/>
      <stop offset="1" stop-color="#883A62"/>
    </linearGradient>
    <radialGradient id="bA" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#FFE2AE"/><stop offset="1" stop-color="#EE8C3C"/></radialGradient>
    <radialGradient id="bB" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#FBC0D2"/><stop offset="1" stop-color="#E26A8E"/></radialGradient>
    <radialGradient id="bC" cx="0.35" cy="0.28" r="0.9"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F2D7C0"/></radialGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <radialGradient id="vig" cx="0.5" cy="0.36" r="0.85"><stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.2"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.7">
    <circle cx="325" cy="110" r="120" fill="#FFD79E"/>
    <circle cx="60" cy="320" r="135" fill="#B14E86"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.4" fill="none">
    <path d="M150 198 q 8 60 -2 122"/>
    <path d="M236 172 q 10 70 0 142"/>
    <path d="M300 248 q -8 50 2 98"/>
  </g>

  <g>
    <ellipse cx="150" cy="160" rx="32" ry="38" fill="url(#bA)"/>
    <path d="M146 197 l4 9 4 -9 z" fill="#EE8C3C"/>
    <ellipse cx="140" cy="148" rx="8" ry="13" fill="#fff" opacity="0.35"/>

    <ellipse cx="236" cy="132" rx="34" ry="40" fill="url(#bB)"/>
    <path d="M232 171 l4 9 4 -9 z" fill="#E26A8E"/>
    <ellipse cx="225" cy="119" rx="8" ry="13" fill="#fff" opacity="0.4"/>

    <ellipse cx="300" cy="210" rx="30" ry="36" fill="url(#bC)"/>
    <path d="M296 245 l4 9 4 -9 z" fill="#F2D7C0"/>
    <ellipse cx="291" cy="199" rx="7" ry="12" fill="#fff" opacity="0.5"/>
  </g>

  <g>
    <rect x="80" y="120" width="8" height="8" rx="1.5" fill="#FFE2AE" transform="rotate(25 84 124)"/>
    <rect x="330" y="300" width="7" height="7" rx="1.5" fill="#FBC0D2" transform="rotate(-18 333 303)"/>
    <circle cx="110" cy="240" r="4" fill="#ffffff" opacity="0.8"/>
    <circle cx="268" cy="300" r="3.5" fill="#FFE2AE"/>
    <rect x="190" y="250" width="6" height="6" rx="1.2" fill="#ffffff" opacity="0.7" transform="rotate(15 193 253)"/>
    <circle cx="62" cy="170" r="3" fill="#FBC0D2"/>
    <rect x="338" y="180" width="7" height="7" rx="1.5" fill="#ffffff" opacity="0.6" transform="rotate(35 341 183)"/>
    <circle cx="160" cy="305" r="3" fill="#FFE2AE" opacity="0.9"/>
  </g>

  <rect width="400" height="500" fill="url(#vig)"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
