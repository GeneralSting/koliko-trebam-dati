<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#5A86CE"/>
      <stop offset="0.5" stop-color="#2E58A0"/>
      <stop offset="1" stop-color="#16284F"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A477F"/>
      <stop offset="1" stop-color="#152C57"/>
    </linearGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33508A"/>
      <stop offset="1" stop-color="#1E376A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBE6A8"/>
      <stop offset="1" stop-color="#D7A648"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <radialGradient id="vig" cx="0.5" cy="0.36" r="0.85"><stop offset="0.5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.24"/></radialGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
  </defs>

  <rect width="400" height="500" fill="url(#bg)"/>
  <g filter="url(#blur)" opacity="0.7">
    <circle cx="95" cy="120" r="120" fill="#A6C8F2"/>
    <circle cx="320" cy="270" r="130" fill="#3E6CBE"/>
  </g>

  <!-- diploma scroll -->
  <g transform="rotate(-12 120 322)">
    <rect x="70" y="312" width="100" height="22" rx="11" fill="#F3E7CF"/>
    <circle cx="70" cy="323" r="11" fill="#E9D9B8" stroke="#D2BD92" stroke-width="1"/>
    <circle cx="170" cy="323" r="11" fill="#E9D9B8" stroke="#D2BD92" stroke-width="1"/>
    <rect x="113" y="305" width="14" height="36" rx="1" fill="#C8102E" opacity="0.92"/>
  </g>

  <!-- mortarboard -->
  <g>
    <path d="M176 158 L224 158 L228 184 Q200 197 172 184 Z" fill="url(#cap)"/>
    <polygon points="200,126 264,158 200,190 136,158" fill="url(#plate)"/>
    <polygon points="200,126 264,158 200,168 136,158" fill="#ffffff" opacity="0.1"/>
    <circle cx="200" cy="158" r="5" fill="url(#gold)"/>
    <path d="M200 158 L256 150 L260 206" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="260" cy="210" r="6" fill="url(#gold)"/>
    <path d="M256 214 v12 M260 214 v13 M264 214 v12" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- stars -->
  <g fill="#EAF1FB">
    <path d="M110 230 c0.8 4 2.4 5.6 6.4 6.4 -4 0.8 -5.6 2.4 -6.4 6.4 -0.8 -4 -2.4 -5.6 -6.4 -6.4 4 -0.8 5.6 -2.4 6.4 -6.4 z" opacity="0.85"/>
    <path d="M300 130 c0.7 3.5 2.1 4.9 5.6 5.6 -3.5 0.7 -4.9 2.1 -5.6 5.6 -0.7 -3.5 -2.1 -4.9 -5.6 -5.6 3.5 -0.7 4.9 -2.1 5.6 -5.6 z" opacity="0.75"/>
    <circle cx="150" cy="115" r="2.4" opacity="0.7"/>
    <circle cx="295" cy="225" r="2.2" opacity="0.7"/>
  </g>

  <rect width="400" height="500" fill="url(#vig)"/>
  <rect width="400" height="500" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay"/>
</svg>
